# deepme engine project: llama.cpp (GGUF serving) — EXPERIMENTAL
# Synced to ~/deepme-runtime/llamacpp via `deepme setup -e llamacpp`.
#
# llama-cpp-python COMPILES CUDA kernels at install time, so the toolkit must
# already be present when its build runs. That's the `cudabuild` group: it is
# synced first (declaratively, `uv sync --only-group cudabuild`), then the
# main sync builds against it with CMake pointed at the venv's own toolkit.
[project]
name = "deepme-engine-llamacpp"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "llama-cpp-python[server]",
]

[dependency-groups]
# Build toolchain, installed before the engine compiles. Versions match the
# other engines' aligned CUDA stack (see README "hard-won toolchain facts").
cudabuild = [
    "nvidia-cuda-nvcc>=13.3,<13.4",
    "nvidia-cuda-runtime>=13.3,<13.4",
    "nvidia-cuda-nvrtc>=13.3,<13.4",
    "nvidia-cuda-cccl",
    "nvidia-cuda-crt",
    "nvidia-cublas",
]

[tool.uv]
default-groups = ["cudabuild"]
override-dependencies = [
    "nvidia-cuda-runtime>=13.3,<13.4",
    "nvidia-cuda-nvrtc>=13.3,<13.4",
]
