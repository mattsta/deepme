[project]
name = "deepme"
version = "0.1.0"
description = "Infrastructure CLI for deploying and managing DeepSeek-V4-Flash on the 8x5090 inference server"
readme = "README.md"
authors = [
    { name = "Matt Stancliff", email = "matt@genges.com" }
]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15",
    "httpx>=0.28",
    "rich>=13.0",
]

[project.scripts]
deepme = "deepme.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi>=0.141.1",
    "httpx2>=2.10.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A hung test must IDENTIFY ITSELF: after 20s the faulthandler dumps the
# stuck test's name and every thread's stack to stderr. Waiting out outer
# timeouts to learn *that* something hung — but never *what* — turned
# one-second diagnoses into ten-minute blind cycles.
faulthandler_timeout = 20
# Warnings fail the gate. A deprecation that scrolls past on every run is
# invisible by the third day; making it an error makes it a task.
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Modernization set: PTH (pathlib over os.path), RET (return hygiene),
# PIE (misc simplifications), PERF (accidental quadratic/copies), G
# (logging), DTZ deliberately NOT enabled (naive time is fine for
# monotonic-style bookkeeping here).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF",
          "PIE", "RET", "PERF", "PTH", "FURB", "PGH"]
ignore = [
    "E501",    # long lines: prose comments carry hard-won context
    "B008",    # typer uses function calls in argument defaults by design
    "SIM108",  # ternaries are not always clearer than if/else
]

[tool.ruff.lint.per-file-ignores]
# The guard's whole job is blocking exotic dash code points — the test data
# contains them deliberately.
"tests/test_gate.py" = ["RUF001", "RUF002", "RUF003"]
"deploy/guard/policy.toml" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
files = ["src/deepme"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
